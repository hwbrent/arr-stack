version: "3.8"

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=your_private_key_here
      - WIREGUARD_ADDRESSES=your_address_here
      - SERVER_COUNTRIES=Netherlands
    ports:
      - 9117:9117   # Jackett UI, exposed via gluetun's network
    restart: unless-stopped

  jackett:
    image: linuxserver/jackett
    container_name: jackett
    network_mode: "service:gluetun"   # routes all Jackett traffic through the VPN
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./jackett/config:/config
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./radarr/config:/config
      - ./media/movies:/movies
      - ./downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./sonarr/config:/config
      - ./media/tv:/tv
      - ./downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  overseerr:
    image: sctx/overseerr
    container_name: overseerr
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    volumes:
      - ./overseerr/config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  plex:
    image: linuxserver/plex
    container_name: plex
    network_mode: host   # Plex works best on host networking for local discovery
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
    volumes:
      - ./plex/config:/config
      - ./media/movies:/movies
      - ./media/tv:/tv
    restart: unless-stopped
