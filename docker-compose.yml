services:
  plex:
    # https://docs.linuxserver.io/images/docker-plex/#usage
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - VERSION=docker
    env_file:
      - ./public.env
    volumes:
      - ./data/plex:/config
      - "/Volumes/Misc/Plex/Movies:/movies"
      - "/Volumes/Misc/Plex/TV Shows:/tv"
    ports:
      - 32400:32400/tcp
    restart: unless-stopped

  gluetun:
    # Image: https://hub.docker.com/r/qmcgaw/gluetun
    # Wiki: https://github.com/qdm12/gluetun-wiki#gluetun-wiki
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=expressvpn
      - SERVER_COUNTRIES=Ireland
      - HEALTH_CHECK_ENABLED=true
      - HEALTH_CHECK_PORT=9999
    env_file:
      - ./private.env
    volumes:
      - ./expressvpn-configs:/gluetun/openvpn/
      - ./data/gluetun:/gluetun
    ports:
      - 9117:9117 # Jackett UI
      - 8080:8080 # qBittorrent UI
      - 6881:6881 # qBittorrent torrenting (TCP)
      - 6881:6881/udp # qBittorrent torrenting (UDP)
    restart: unless-stopped

  qbittorrent:
    # Image: https://hub.docker.com/r/linuxserver/qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "container:gluetun"
    depends_on:
      - gluetun
    environment:
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    env_file:
      - ./public.env
    volumes:
      - ./data/qbittorrent:/config
      - "/Volumes/Misc/Plex/downloads:/downloads"

      # So that it picks up the preexisting data copied across from the desktop app:
      - "/Volumes/Misc/Plex/Movies:/Volumes/Misc/Plex/Movies"
      - "/Volumes/Misc/Plex/TV Shows:/Volumes/Misc/Plex/TV Shows"
    stop_grace_period: "10s" # optional
    restart: unless-stopped
