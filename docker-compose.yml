version: "3.8"

services:
  # https://hub.docker.com/r/qmcgaw/gluetun#setup
  gluetun:
    # https://github.com/qdm12/gluetun-wiki/blob/main/setup/providers/expressvpn.md
    # https://www.expressvpn.com/support/vpn-setup/manual-config-for-windows-with-openvpn/
    # https://www.acciyo.com/your-guide-to-expressvpn-openvpn-configuration-a-step-by-step-walkthrough/
    # https://www.acciyo.com/expressvpn-gluetun-your-ultimate-guide-to-secure-self-hosted-docker-containers/
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=expressvpn
      - EXPRESSVPN_SERVER_LOCATION=my_expressvpn_ireland_udp
      - FIREWALL_DROP_LOCAL_LAN=true
      - FIREWALL_LIMIT_VLAN_SUBNET=true # Optional: Blocks traffic to your local network if needed
    env_file:
      - ./private.env
    volumes:
      - ./expressvpn-configs:/gluetun/openvpn/
      - ./data/gluetun:/gluetun
    ports:
      - 9117:9117   # Jackett UI, exposed via gluetun's network
    restart: unless-stopped

  # https://github.com/Jackett/Jackett#docker-installation
  jackett:
    # https://hub.docker.com/r/linuxserver/jackett/#usage
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    network_mode: "container:gluetun"   # routes all Jackett traffic through the VPN
    depends_on:
      - gluetun
    env_file:
      - ./public.env
    volumes:
      - ./data/jackett:/config
      - "/Volumes/Misc/Plex/downloads:/downloads"
    restart: unless-stopped

  # https://wiki.servarr.com/radarr/installation/docker
  radarr:
    # https://docs.linuxserver.io/images/docker-radarr
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    env_file:
      - ./public.env
    volumes:
      - ./data/radarr:/config
      - "/Volumes/Misc/Plex/Movies:/movies"
      - "/Volumes/Misc/Plex/downloads:/downloads"
    ports:
      - 7878:7878
    restart: unless-stopped

  # https://wiki.servarr.com/sonarr/installation/docker
  sonarr:
    # https://docs.linuxserver.io/images/docker-sonarr/
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    env_file:
      - ./public.env
    volumes:
      - ./data/sonarr:/config
      - "/Volumes/Misc/Plex/TV Shows:/tv"
      - "/Volumes/Misc/Plex/downloads:/downloads"
    ports:
      - 8989:8989
    restart: unless-stopped

  # https://docs.seerr.dev/getting-started/docker/?docker-methods=docker-compose
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
    env_file:
      - ./public.env
    ports:
      - 5055:5055
    volumes:
      - ./data/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  # overseerr:
  #   image: sctx/overseerr
  #   container_name: overseerr
  #   environment:
  #     - LOG_LEVEL=info
  #   volumes:
  #     - ./overseerr/config:/app/config
  #   ports:
  #     - 5055:5055
  #   restart: unless-stopped

  # https://support.plex.tv/articles/200288586-installation/
  # ^ this tells you to use a different image which apparently is crap
  plex:
    # https://docs.linuxserver.io/images/docker-plex/#usage
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host   # Plex works best on host networking for local discovery
    environment:
      - VERSION=docker
    env_file:
      - ./public.env
    volumes:
      - ./data/plex:/config
      - "/Volumes/Misc/Plex/Movies:/movies"
      - "/Volumes/Misc/Plex/TV Shows:/tv"
    restart: unless-stopped
